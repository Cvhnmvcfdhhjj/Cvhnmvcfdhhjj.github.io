<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anotações de Campo</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- PWA Manifest and Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">

    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Anotações">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>Anotações de Campo</h1>
        </header>

        <main class="main-content">
            <div class="form-container">
                <h2>Nova Anotação</h2>
            <div class="form-group">
                <label for="crop-select">Cultura:</label>
                <select id="crop-select">
                    <option value="amora">Amora Preta</option>
                    <option value="framboesa">Framboesa</option>
                    <option value="uva">Uva</option>
                </select>
            </div>

            <div class="form-group">
                <label for="note-type">Tipo de Anotação:</label>
                <select id="note-type">
                    <option value="gastos">Gastos</option>
                    <option value="mao_de_obra">Mão de Obra</option>
                    <option value="adubacao">Adubação</option>
                    <option value="tratamentos">Tratamentos</option>
                    <option value="pluviometria">Pluviometria</option>
                </select>
            </div>

            <div class="form-group">
                <label for="note-content">Anotação:</label>
                <textarea id="note-content" rows="4"></textarea>
            </div>

            <button id="save-note-btn">Salvar Anotação</button>
        </div>

        <div class="notes-list-container">
            <h2>Anotações Salvas</h2>
            <div id="notes-list">
                <!-- As anotações serão exibidas aqui -->
            </div>
        </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
