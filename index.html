<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anotações de Campo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Anotações de Campo</h1>

        <div class="form-container">
            <h2>Nova Anotação</h2>
            <div class="form-group">
                <label for="crop-select">Cultura:</label>
                <select id="crop-select">
                    <option value="amora">Amora Preta</option>
                    <option value="framboesa">Framboesa</option>
                    <option value="uva">Uva</option>
                </select>
            </div>

            <div class="form-group">
                <label for="note-type">Tipo de Anotação:</label>
                <select id="note-type">
                    <option value="gastos">Gastos</option>
                    <option value="mao_de_obra">Mão de Obra</option>
                    <option value="adubacao">Adubação</option>
                    <option value="tratamentos">Tratamentos</option>
                    <option value="pluviometria">Pluviometria</option>
                </select>
            </div>

            <div class="form-group">
                <label for="note-content">Anotação:</label>
                <textarea id="note-content" rows="4"></textarea>
            </div>

            <button id="save-note-btn">Salvar Anotação</button>
        </div>

        <div class="notes-list-container">
            <h2>Anotações Salvas</h2>
            <div id="notes-list">
                <!-- As anotações serão exibidas aqui -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
